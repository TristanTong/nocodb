# CentOS / 内网：Backend(6080) + 最新 nc-gui 生产 UI(6100)
#
# 用法概要：
# 1) 构建机用 packages/nocodb/Dockerfile.centos 打出后端镜像（含 mssql），
#    标签必须带版本号，例如 mlnocodb:0.1.6（见 scripts/compat/package_release_0.1.6.py）
#    并构建前端 packages/nc-gui/.output
# 2) 把镜像与 .output 拷到服务器
# 3) 复制本文件为 docker-compose.yml，改 image 标签、NC_DB、
#    NUXT_PUBLIC_NC_BACKEND_URL、NC_PUBLIC_URL
# 4) docker compose up -d
# 5) docker exec mlnocodb-api node -e "require('mssql'); console.log('mssql_ok')"
#
# 文档：docs/11-CentOS7快速部署.md、docs/08-系统运维手册.md（100.93 升级）
#
# 访问：
#   最新 UI:         http://<IP>:6100/
#   API/内置旧 GUI: http://<IP>:6080/dashboard

version: "2.4"

services:
  mlnocodb-api:
    # 禁止写死 digest；生产升级请改标签，保留旧 tag 以便回滚
    image: mlnocodb:0.1.6
    container_name: mlnocodb-api
    restart: always
    ports:
      - "6080:8080"
    environment:
      # 密码中的 @ 写成 %40；勿把真实密码提交 Git
      # 生产 Meta：192.168.100.97；测试 Meta：192.168.100.89
      NC_DB: "pg://192.168.100.97:5432?u=postgres&p=REPLACE_ME&d=mlnoco"
      NC_DISABLE_TELE: "true"
      # 外网映射时填公网入口；生产内网保持 http://192.168.100.93
      NC_PUBLIC_URL: "http://REPLACE_HOST"
      TZ: "Asia/Shanghai"
    volumes:
      - /opt/mlnocodb/data:/usr/app/data

  mlnocodb-ui:
    # 任意带 Node ≥22 的镜像即可；也可用公司内网 node:22-slim 镜像
    image: node:22-slim
    container_name: mlnocodb-ui
    restart: always
    working_dir: /app
    command: ["node", "server/index.mjs"]
    ports:
      - "6100:6100"
    environment:
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "6100"
      PORT: "6100"
      # 浏览器会请求该地址；经 nginx 同源反代时应填公网入口，勿填仅内网 IP
      # 否则外网/Chrome（Private Network Access）登录会 Network Error
      NUXT_PUBLIC_NC_BACKEND_URL: "http://REPLACE_HOST"
      NUXT_PAGE_TRANSITION_DISABLE: "true"
      TZ: "Asia/Shanghai"
    # 构建机产出：packages/nc-gui/.output 整目录拷到服务器 /opt/mlnocodb/ui-output
    # 生产当前目录名多为 /opt/mlnocodb/ui —— 保持与现场一致即可
    volumes:
      - /opt/mlnocodb/ui-output:/app:ro
